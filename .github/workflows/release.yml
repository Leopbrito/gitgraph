name: Release

# Publishes to npm when a version tag is pushed (git tag v0.2.0 && git push --tags).
# Authentication: npm trusted publishing (OIDC, no stored secret) is tried first once the package has a
# trusted publisher for this workflow; the NPM_TOKEN secret is only the fallback until then.
# See docs/ia/conventions/release.md for the one-time setup and for removing the token afterwards.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No cache in a release build.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later (Node 22 ships npm 10).
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag must match the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, tests and build. With a trusted publisher npm authenticates
      # through OIDC and the token below is ignored; delete the env block once that has worked.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
