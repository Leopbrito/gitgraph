name: Release

# Publishes to npm when a version tag is pushed (git tag v0.2.0 && git push --tags).
# Needs the NPM_TOKEN secret (an npm automation token). See docs/ia/conventions/release.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: The tag must match the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
